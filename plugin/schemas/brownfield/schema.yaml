name: brownfield
version: 1
description: >
  Brownfield audit-driven workflow. Unlike the greenfield SDD cycle (which starts
  from a blank define), this starts from an existing codebase: a first-class
  `audit` artifact inventories what is already built (with evidence), the gaps,
  the weak points and the ops-readiness controls, then bridges into the full
  define/design/build/ship cycle via the typed proposedTasks. feature = the domain
  or subsystem under audit.

config:
  build_retry_cap: 3

# Lifecycle hook -> gate(s). G_AUDIT is anchored TWICE: `before_define` fail-fasts the
# run right after the audit phase (define cannot proceed on an un-gated audit — the
# same contract the /audit command promises), and `during` keeps it as a TERMINAL
# backstop (the run can never be reported complete on an un-evidenced audit even if a
# command skipped the early anchor). The other before_<id> hooks mirror the SDD cycle.
gates:
  during: G_AUDIT
  before_define: G_AUDIT
  before_design: G_DEFINE
  before_build: G_DESIGN
  before_ship: [G_BUILD, G_SHIP]

artifacts:
  - id: audit
    generates: AUDIT.md
    template: audit.md
    model: opus
    handoff: audit
    parallel_group: by_domain
    requires: []
    description: >
      Phase 0 — brownfield inventory. What is built (with file+line evidence and
      proven/partial/scaffolded status), the gaps (blocking/important/nice-to-have),
      weak points, ops-readiness controls, and the proposedTasks bridge into define.

  - id: define
    generates: DEFINE.md
    template: define.md
    model: opus
    handoff: define
    requires: [audit]
    description: Phase 1 — requirements distilled from the audit's proposedTasks.
    validate:
      md_sections: [Why, What, Acceptance Criteria]
      criteria_ids_prefix: AC

  - id: design
    generates: DESIGN.md
    template: design.md
    model: opus
    handoff: design
    requires: [define]
    description: Phase 2 — architecture + a file manifest the build executes.
    validate:
      md_sections: [Overview, File Manifest, Decisions]
      manifest_table: true

  - id: build
    generates: BUILD_REPORT.md
    template: build-report.md
    model: sonnet
    handoff: build-report
    parallel_group: by_manifest_layer
    requires: [design]
    description: Phase 3 — execute the manifest; results keyed by AC-n.

  - id: ship
    generates: SHIPPED.md
    template: shipped.md
    model: haiku
    requires: [build]
    description: Phase 4 — archive + lessons; gated on all criteria met.
